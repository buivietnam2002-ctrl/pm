  cupertino_icons: ^1.0.8
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
